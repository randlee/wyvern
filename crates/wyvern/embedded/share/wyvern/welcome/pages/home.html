<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wyvern Guide</title>
  <link rel="stylesheet" href="/wizard/styles.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0 24px;
    }
    .guide-card {
      border: 1px solid #c9cdd4;
      border-radius: 8px;
      padding: 16px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .guide-card:hover { border-color: #3b6ea5; }
  </style>
</head>
<body>
  <h1 data-testid="guide-home">Wyvern Guide</h1>
  <p class="lead">Choose a topic. Full example tours land in later sprints.</p>
  <div class="guide-grid" data-testid="guide-topics"></div>
  <p class="error" data-testid="wizard-error" hidden></p>
  <script>
    (function () {
      function topicTitle(id) {
        return ({
          overview: "Overview",
          questions: "AskUserQuestion",
          templates: "Template wizard",
          "agent-dag": "Agent DAG"
        })[id] || id;
      }

      // Skip the welcome Templates prose gate (REQ-0126). Same hop as Finish
      // on pages/templates.html.
      window.wizardTemplatesNextWizard = {
        path: "{wyvern_share}/examples/template-picker/wizard.json",
        input: { from: "welcome" },
        ui_root: "{wyvern_share}/examples/template-picker"
      };

      function showError(err) {
        var el = document.querySelector("[data-testid='wizard-error']");
        if (el) { el.hidden = false; el.textContent = String(err); }
      }

      function finishToTemplatePicker() {
        var data = {};
        var stack = (window.wyvern && Array.isArray(window.wyvern.stack)
          ? window.wyvern.stack.slice()
          : []);
        stack.push({
          page: window.wyvern ? window.wyvern.page : null,
          data: data
        });
        return wyvernWizardFinish({
          button: "finish",
          data: data,
          stack: stack,
          next_wizard: window.wizardTemplatesNextWizard
        });
      }

      window.wyvernReady = window.wyvernReady || Promise.resolve();
      window.wyvernReady.then(function () {
        return fetch("/api/wizard/state").then(function (r) { return r.json(); });
      }).then(function (state) {
        var topics = (state.config && state.config.topics) || [];
        var grid = document.querySelector("[data-testid='guide-topics']");
        topics.forEach(function (topic) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "guide-card";
          btn.dataset.topicId = topic.id;
          btn.textContent = topic.label || topicTitle(topic.id);
          btn.addEventListener("click", function () {
            if (topic.id === "templates") {
              if (typeof wyvernWizardFinish === "function") {
                finishToTemplatePicker().catch(showError);
              }
              return;
            }
            if (typeof wyvernWizardNext === "function") {
              wyvernWizardNext({}, {
                id: topic.id,
                title: topic.label || topicTitle(topic.id),
                html: topic.html
              });
            }
          });
          grid.appendChild(btn);
        });
      }).catch(showError);
    })();
  </script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

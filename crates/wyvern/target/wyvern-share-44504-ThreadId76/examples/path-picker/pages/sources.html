<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose paths</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .path-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 8px;
    }
    .path-list {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      min-height: 2.5rem;
      background: #fff;
    }
    .path-list li {
      padding: 8px 12px;
      overflow-wrap: anywhere;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .path-list li:last-child { border-bottom: 0; }
    .path-list:empty::after {
      content: "None yet — browse or keep the agent seed paths.";
      display: block;
      color: #64748b;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame" data-testid="path-sources">
    <h1 data-testid="path-sources-heading">Choose paths</h1>
    <p class="lead">
      Browse native file (multi-select) and folder pickers on this page.
      <code>config.seed_paths</code> pre-fills the lists for agent-driven demos.
      Page JS stores path strings only — it does not read or write the filesystem.
    </p>
    <div class="path-actions">
      <button type="button" class="secondary" data-testid="browse-file">
        Browse files
      </button>
      <button type="button" class="secondary" data-testid="browse-folder">
        Browse folder
      </button>
    </div>
    <h2>Files</h2>
    <ul class="path-list" data-testid="file-list"></ul>
    <h2>Folders</h2>
    <ul class="path-list" data-testid="folder-list"></ul>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Next
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

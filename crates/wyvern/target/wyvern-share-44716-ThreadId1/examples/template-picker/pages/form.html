<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customize template</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .field { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
    .field input { font: inherit; padding: 6px 8px; }
  </style>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame" data-testid="template-form">
    <h1 data-testid="template-form-heading">Customize template</h1>
    <p class="lead">
      Set output path and template variables. This step is form fields only —
      there is no in-browser file editor.
    </p>
    <p>
      Template: <strong data-testid="form-template-id">—</strong>
    </p>
    <form data-testid="template-vars">
      <label class="field">
        Output path
        <input type="text" name="output_path" data-testid="field-output-path" />
      </label>
      <div data-testid="variable-fields"></div>
    </form>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Next
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review paths</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .path-list {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .path-list li {
      padding: 8px 12px;
      overflow-wrap: anywhere;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .path-list li:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <main
    id="dialog"
    class="dialog dialog--frame"
    data-wizard-terminal="true"
    data-testid="path-review"
  >
    <h1 data-testid="path-review-heading">Review paths</h1>
    <p class="lead">
      Finish returns these path strings in <code>data.file_paths</code> and
      <code>data.folder_paths</code>. Cancel writes nothing.
    </p>
    <h2>Files</h2>
    <ul class="path-list" data-testid="review-file-paths"></ul>
    <h2>Folders</h2>
    <ul class="path-list" data-testid="review-folder-paths"></ul>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="secondary" data-wizard-cancel data-testid="wizard-cancel">
        Cancel
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Finish
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

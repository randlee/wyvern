<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Step 1</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame">
    <h1>Step 1</h1>
    <p>Two-page wizard skeleton. Edit this page, then continue.</p>

      <button type="button" class="secondary" data-wizard-back>Back</button>
      <button type="button" class="primary" data-wizard-next>Next</button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script>
    window.collectCurrentPageData = function () { return {}; };
    window.wizardNextDescriptor = {
      id: "two",
      title: "Step 2",
      html: "pages/two.html"
    };
  </script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>

boundary_id = "BOUNDARY-WyvernCli"
owner_package = "wyvern-cli"
name = "WyvernCli"

[dependencies]
# wyvern-viewer: optional dep for dev binary-path helpers; embedded spawn uses subprocess (no wry in CLI)
allowed_dependencies = [
  "wyvern-schema",
  "wyvern-host",
  "wyvern-wizard",
  "wyvern-viewer",
  "serde",
  "serde_json",
  "tracing",
  "tracing-subscriber",
  "sc-observability",
  "sc-observability-types",
  "dirs",
  "rust-embed",
  "tempfile",
  "libc",
]
forbidden_edges = [
  "wyvern-cli -> wyvern-mcp",
  "wyvern-cli -> wry",
  "wyvern-cli -> winit",
  "wyvern-cli -> rfd",
]

[ownership]
io_owns = ["stdin_reading", "stdout_writing", "stderr_writing", "arg_parsing", "host_options", "viewer_flag", "embedded_viewer_spawn", "viewer_show_hide", "workflow_script_spawn", "wizard_chain_loop"]
io_forbidden = ["http_server", "webview_creation", "static_file_serve", "dialog_content_html"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-CLI-NO-WINDOW-DIRECT"]

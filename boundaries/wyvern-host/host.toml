boundary_id = "BOUNDARY-WyvernHost"
owner_package = "wyvern-host"
owner_crate_path = "wyvern_host"
name = "WyvernHost"

[public]
facade = "run"

[implementation]
type = "HostError"
module = "wyvern_host"
visibility = "public"
constructor = "none"

[composition]
roots = [
  "run",
  "begin",
  "DialogHandle",
  "HostOptions",
  "HostError",
  "ViewerMode",
  "BrowserRegistryEntry",
]

[dependencies]
allowed_dependents = ["wyvern-cli", "wyvern-mcp"]
allowed_dependencies = [
  "wyvern-schema",
  "serde",
  "serde_json",
  "axum",
  "tokio",
  "tower",
  "tower-http",
  "tracing",
  "rfd",
  "webbrowser",
  "dirs",
  "pulldown-cmark",
  "ammonia",
  "wyvern-wizard",
]
forbidden_edges = [

  { from = "wyvern-host", to = "wyvern-cli" },
  { from = "wyvern-host", to = "wyvern-mcp" },
  { from = "wyvern-host", to = "wry" },
  { from = "wyvern-host", to = "winit" },
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-HOST-NO-CLI", "LINT-BOUNDARY-HOST-NO-WEBVIEW"]
review_gates = ["http_host_only"]

[status]
state = "concrete_landed"

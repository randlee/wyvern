boundary_id = "BOUNDARY-WyvernSchema"
owner_package = "wyvern-schema"
name = "WyvernSchema"

[dependencies]
allowed_dependencies = ["serde", "serde_json", "strsim"]
forbidden_edges = [
  "wyvern-schema -> wyvern-cli",
  "wyvern-schema -> wyvern-wizard",
  "wyvern-schema -> wyvern-mcp",
  "wyvern-schema -> wry",
  "wyvern-schema -> winit",
  "wyvern-schema -> rfd",
]

[ownership]
io_owns = ["type_definitions", "validation_logic", "error_message_formatting"]
io_forbidden = ["file_io", "network_io", "window_creation", "webview", "async_runtime"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-SCHEMA-PURE-LOGIC"]

# Org-wide publish destinations — vendored byte-for-byte into every kit consumer.
# install.py enforces this file: required channels must be declared in
# release/install.json, and destination fields must match (no overrides).
# Change upstream in sc-publish only; consumer hand-edits are defects.

schema_version = 1

# Post-release channels every consumer MUST declare. Omitting any entry fails sync.
required_channels = ["homebrew", "scoop", "winget"]

[destinations.homebrew]
tap_repository = "randlee/homebrew-tap"

[destinations.scoop]
bucket_repository = "randlee/scoop-bucket"

[destinations.winget]
publisher_id = "randlee"
pkgs_upstream = "microsoft/winget-pkgs"

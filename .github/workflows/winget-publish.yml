name: Publish Winget

# This post-release channel reads its package identity and installer pattern
# from release/publish-artifacts.toml and may be re-dispatched for the same tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to submit (e.g. v1.4.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-winget-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      channel_config: ${{ steps.config.outputs.channel_config }}
      asset_patterns: ${{ steps.config.outputs.asset_patterns }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - id: config
        name: Read Winget configuration from release manifest
        shell: bash
        run: |
          set -euo pipefail
          config="$(python3 .github/scripts/release_artifacts.py channel-config --manifest release/publish-artifacts.toml --channel winget)"
          echo "channel_config=${config}" >> "$GITHUB_OUTPUT"
          {
            echo 'asset_patterns<<EOF'
            jq -r '.asset_patterns[]' <<<"${config}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ inputs.tag }}
          asset_patterns: ${{ steps.config.outputs.asset_patterns }}
      - id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  publish-winget:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      # Detect-and-skip: a retried leg must not open a duplicate winget-pkgs
      # pull request for an identifier+version that is already merged or
      # already awaiting review. The probe fails closed: only a confirmed
      # 404 (manifest genuinely absent) may proceed to the duplicate-PR
      # search, and only a complete search result may proceed to submission;
      # any other probe outcome (auth, rate limit, transient API error,
      # incomplete search results) hard-fails the leg instead of being read
      # as "not found".
      - id: winget_probe
        name: Probe winget-pkgs for an existing manifest or submission (fail closed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTIFIER: ${{ fromJSON(needs.verify-release.outputs.channel_config).channel.identifier }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          first_letter="$(tr '[:upper:]' '[:lower:]' <<<"${IDENTIFIER:0:1}")"
          manifest_path="manifests/${first_letter}/${IDENTIFIER//.//}/${version}"
          already_published=false
          probe_stderr="$(mktemp)"
          if gh api "repos/microsoft/winget-pkgs/contents/${manifest_path}" >/dev/null 2>"${probe_stderr}"; then
            echo "winget-pkgs already publishes ${IDENTIFIER} ${version} (${manifest_path}); skipping submission."
            already_published=true
          elif ! grep -Eqi 'HTTP 404|Not Found' "${probe_stderr}"; then
            echo "winget-pkgs manifest probe for ${IDENTIFIER} ${version} is indeterminate (not a confirmed 404); failing closed instead of risking a duplicate submission." >&2
            cat "${probe_stderr}" >&2
            exit 1
          else
            search_response="$(gh api -X GET search/issues \
              -f q="repo:microsoft/winget-pkgs type:pr in:title ${IDENTIFIER} ${version}")"
            pr_count="$(python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          if data.get("incomplete_results"):
              raise SystemExit(
                  "winget-pkgs pull request search returned incomplete results; "
                  "failing closed instead of risking a duplicate submission"
              )
          print(data["total_count"])
          ' <<<"${search_response}")"
            if [[ "${pr_count}" != "0" ]]; then
              echo "A winget-pkgs pull request (open or merged) already exists for ${IDENTIFIER} ${version}; skipping submission."
              already_published=true
            fi
          fi
          echo "already_published=${already_published}" >> "$GITHUB_OUTPUT"

      - name: Require WinGet fork credential
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        shell: bash
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WINGET_GITHUB_TOKEN}" ]]; then
            echo 'WINGET_GITHUB_TOKEN is required to submit to microsoft/winget-pkgs.' >&2
            exit 1
          fi

      - name: Install komac
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        uses: cargo-bins/cargo-binstall@main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install komac CLI
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        run: cargo binstall komac -y
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare WinGet installer variables from release asset
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.channel_config }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          printf '%s' "${CHANNEL_CONFIG}" > channel-config.json
          python3 .github/scripts/winget_release.py prepare-vars \
            --channel-config channel-config.json \
            --repository "${RELEASE_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --version "${RELEASE_VERSION}" \
            --output winget-vars.json

      - name: Generate WinGet manifests with komac
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        shell: bash
        env:
          IDENTIFIER: ${{ fromJSON(needs.verify-release.outputs.channel_config).channel.identifier }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
          GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: wyvern winget-publish.yml
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          url="$(jq -r '.installer_url' winget-vars.json)"
          komac update "${IDENTIFIER}" \
            --version "${RELEASE_VERSION}" \
            --urls "${url}" \
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}" \
            --output winget-manifests \
            --dry-run

      - name: Patch nested portable installer path
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        run: |
          python3 .github/scripts/winget_release.py patch-installer \
            --output-dir winget-manifests \
            --vars winget-vars.json

      - name: Submit WinGet pull request
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        shell: bash
        env:
          IDENTIFIER: ${{ fromJSON(needs.verify-release.outputs.channel_config).channel.identifier }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
          GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: wyvern winget-publish.yml
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          first_letter="$(tr '[:upper:]' '[:lower:]' <<<"${IDENTIFIER:0:1}")"
          manifest_dir="winget-manifests/manifests/${first_letter}/${IDENTIFIER//.//}/${RELEASE_VERSION}"
          komac submit "${manifest_dir}" --yes

      - name: Cleanup merged komac branches
        if: ${{ steps.winget_probe.outputs.already_published != 'true' }}
        run: komac cleanup --only-merged
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}

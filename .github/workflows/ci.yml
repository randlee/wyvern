name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*"]
  push:
    branches: [develop, main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rfd (xdg-portal/ashpd) needs wayland-client.pc; wry needs webkit2gtk (c.15 viewer).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            mesa-utils \
            at-spi2-core \
            dbus-x11 \
            xvfb

      - name: cargo build
        run: cargo build --workspace

      # Workspace includes wyvern-viewer (wry); headless e2e still uses --viewer none.
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Set up sc-lint (published release bundle)
        uses: ./.github/actions/setup-sc-lint

      - name: sc-lint check
        run: sc-lint check native --config .sc-lint.toml

  wizard-lint:
    name: wyvern wizard lint (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            mesa-utils \
            at-spi2-core \
            dbus-x11 \
            xvfb

      - name: cargo build -p wyvern-cli
        run: cargo build -p wyvern-cli

      - name: Set WYVERN_BIN
        run: echo "WYVERN_BIN=${GITHUB_WORKSPACE}/target/debug/wyvern" >> "$GITHUB_ENV"

      - name: wyvern wizard lint template-picker
        run: ${WYVERN_BIN} wizard lint share/wyvern/examples/template-picker

      - name: wyvern wizard lint askuserquestion-hook
        run: ${WYVERN_BIN} wizard lint share/wyvern/examples/askuserquestion-hook

      - name: wyvern wizard lint welcome guide
        run: ${WYVERN_BIN} wizard lint share/wyvern/welcome

      - name: wyvern wizard lint agent-dag
        run: ${WYVERN_BIN} wizard lint share/wyvern/examples/agent-dag

      - name: wyvern wizard lint path-picker
        run: ${WYVERN_BIN} wizard lint share/wyvern/examples/path-picker

      - name: wyvern wizard lint dataflow fixture
        run: ${WYVERN_BIN} wizard lint fixtures/wizard-dataflow-lint

  report-xhtml:
    name: report-xhtml example smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            mesa-utils \
            at-spi2-core \
            dbus-x11 \
            xvfb \
            ripgrep \
            curl

      - name: cargo build -p wyvern-cli
        run: cargo build -p wyvern-cli

      - name: Set WYVERN_BIN
        run: echo "WYVERN_BIN=${GITHUB_WORKSPACE}/target/debug/wyvern" >> "$GITHUB_ENV"

      # Report examples MUST NOT use wizard-nav (contract § Boundaries)
      - name: xhtml-review has no wizard-nav
        run: test -z "$(rg -n 'wizard-nav' share/wyvern/examples/xhtml-review/ || true)"

      - name: validate xhtml-review view manifest
        run: python3 scripts/ext/xhtml_report.py --validate-manifest share/wyvern/examples/xhtml-review/review-view.json

      # Viewer none keeps the host until dismiss; POST /api/result so CI exits 0.
      - name: report-xhtml smoke (viewer none)
        run: |
          set -euo pipefail
          URL_FILE="$(mktemp)"
          WYVERN_VIEWER=none WYVERN_DIALOG_URL_FILE="$URL_FILE" \
            "${WYVERN_BIN}" report-xhtml share/wyvern/examples/xhtml-review/review-view.json \
            > /tmp/report-xhtml-stdout.txt 2>/tmp/report-xhtml-stderr.txt &
          PID=$!
          for _ in $(seq 1 200); do
            if [ -s "$URL_FILE" ]; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "wyvern exited before publishing a dialog URL" >&2
              cat /tmp/report-xhtml-stderr.txt >&2 || true
              exit 1
            fi
            sleep 0.1
          done
          URL="$(tr -d '[:space:]' < "$URL_FILE")"
          test -n "$URL"
          curl -fsS "$URL" >/dev/null
          RESULT="${URL%%/report/*}/api/result"
          curl -fsS -X POST "$RESULT" -H 'content-type: application/json' -d '{"button":"dismissed"}'
          wait "$PID"

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  playwright:
    name: Playwright L2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rfd (xdg-portal/ashpd) needs wayland-client.pc; wry needs webkit2gtk (c.15 viewer).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            mesa-utils \
            at-spi2-core \
            dbus-x11 \
            xvfb

      - name: cargo build -p wyvern-cli
        run: cargo build -p wyvern-cli

      - name: Set WYVERN_BIN
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "WYVERN_BIN=${GITHUB_WORKSPACE}/target/debug/wyvern.exe" >> "$GITHUB_ENV"
          else
            echo "WYVERN_BIN=${GITHUB_WORKSPACE}/target/debug/wyvern" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install e2e npm deps
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # message + input specs spawn wyvern with --viewer none (CI/agent headless path).
      - name: Run message.spec.ts
        working-directory: tests/e2e
        run: npx playwright test message.spec.ts

      - name: Run input.spec.ts
        working-directory: tests/e2e
        run: npx playwright test input.spec.ts

      - name: Run markdown.spec.ts
        working-directory: tests/e2e
        run: npx playwright test markdown.spec.ts

      - name: Run question.spec.ts
        working-directory: tests/e2e
        run: npx playwright test question.spec.ts

      - name: Run chrome.spec.ts
        working-directory: tests/e2e
        run: npx playwright test chrome.spec.ts

      - name: Install l2 npm deps
        working-directory: tests/l2
        run: npm install

      - name: Install Playwright Chromium (l2)
        working-directory: tests/l2
        run: npx playwright install --with-deps chromium

      - name: Run Phase D L2 specs
        working-directory: tests/l2
        run: npx playwright test wizard-layout-picker viewport-sizing wizard-edge-cases

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  boundaries:
    name: Boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up sc-lint (published release bundle)
        uses: ./.github/actions/setup-sc-lint

      - name: sc-lint boundary inventory
        run: sc-lint lint sc-boundary --config .sc-lint.toml

      - name: Enforce io_forbidden grep policy
        run: python3 scripts/check-boundaries.py

      - name: Verify ui/ matches crates/wyvern/ui/
        run: bash scripts/check-ui-sync.sh

      - name: Verify share/ and scripts/ext match crates/wyvern/
        run: bash scripts/check-share-sync.sh

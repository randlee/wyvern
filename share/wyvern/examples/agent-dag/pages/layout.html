<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent DAG</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin: 16px 0 8px;
    }
    .layout-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .layout-card:hover { border-color: #3b6ea5; }
    .layout-card.is-selected { border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
    .layout-card__agents { display: block; color: #475569; font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame" data-testid="agent-dag-layout">
    <h1 data-testid="agent-dag-layout-heading">Agent DAG</h1>
    <p class="lead">
      Choose a layout. Cards come from <code>config.layouts</code> only.
      Finish exports the DAG — execution is deferred.
    </p>
    <div class="layout-grid" data-testid="layout-cards"></div>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Next
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configure agent</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .field { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
    .field input { font: inherit; padding: 6px 8px; }
  </style>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame" data-testid="agent-form">
    <h1 data-testid="agent-heading">Configure agent</h1>
    <p class="lead">
      Name this agent and set its role. Back restores these fields when you
      revisit the same layout.
    </p>
    <form data-testid="agent-fields">
      <label class="field">
        Name
        <input type="text" name="name" data-testid="agent-name" autocomplete="off" />
      </label>
      <label class="field">
        Role
        <input type="text" name="role" data-testid="agent-role" autocomplete="off" />
      </label>
    </form>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Next
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

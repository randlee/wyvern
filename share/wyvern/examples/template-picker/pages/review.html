<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review template</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
</head>
<body>
  <main
    id="dialog"
    class="dialog dialog--frame"
    data-wizard-terminal="true"
    data-testid="template-review"
  >
    <h1 data-testid="template-review-heading">Review template</h1>
    <p class="lead">
      Finish copies the template through <code>apply-template.py</code>. Cancel
      writes nothing.
    </p>
    <dl>
      <div>
        <dt>Template</dt>
        <dd data-testid="review-template-id">—</dd>
      </div>
      <div>
        <dt>Output path</dt>
        <dd data-testid="review-output-path">—</dd>
      </div>
      <div>
        <dt>Variables</dt>
        <dd data-testid="review-variables">—</dd>
      </div>
    </dl>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="secondary" data-wizard-cancel data-testid="wizard-cancel">
        Cancel
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Finish
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>

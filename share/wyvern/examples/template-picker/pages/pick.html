<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Templates</title>
  <link rel="stylesheet" href="/shared/embedded-chrome.css" />
  <link rel="stylesheet" href="/shared/wizard-chrome.css" />
  <script src="/shared/wyvern-api.js"></script>
  <style>
    .template-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0 8px;
    }
    .template-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .template-card:hover { border-color: #3b6ea5; }
    .template-card.is-selected { border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
    .template-card__id { display: block; color: #475569; font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>
  <main id="dialog" class="dialog dialog--frame" data-testid="template-pick">
    <h1 data-testid="template-pick-heading">Templates</h1>
    <p class="lead">
      Choose a bundled template. The grid is driven by
      <code>config.templates</code> — page JS does not scan the catalog directory.
    </p>
    <div class="template-grid" data-testid="template-grid"></div>
    <nav class="wizard-chrome" data-wizard-nav aria-label="Wizard navigation">
      <button type="button" class="secondary" data-wizard-back data-testid="wizard-back">
        Back
      </button>
      <button type="button" class="primary" data-wizard-next data-testid="wizard-next">
        Next
      </button>
    </nav>
    <p class="wizard-error" data-testid="wizard-error" hidden></p>
  </main>
  <script src="../app.js"></script>
  <script src="/shared/wizard-nav.js" data-wizard-chrome></script>
</body>
</html>
